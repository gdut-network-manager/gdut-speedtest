<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>测速结果 | GDUTNIC 测速网站</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="https://lib.baomitu.com/layui/2.5.7/css/layui.css"  media="all">
  <style type="text/css">
        @font-face{
                font-family: 'MyriadPro';
                src: url('./font/MyriadPro-Regular.otf');
        }
        @font-face{
                font-family: 'MyriadPro';
                src: url('./font/MyriadPro-Bold.otf');
                font-weight: bold;
        }
        html,body{
                border:none; padding:0; margin:0;
                background:#141526;
                color:#f4f4f5;
        }
        body{
                text-align:center;
                font-family: "MyriadPro","Microsoft YaHei",Helvetica,Arial,sans-serif;
        }
        h1{
                color:#f4f4f5;
        }
        a{
                cursor: pointer;
                color: #fff;
                text-decoration: none;
                outline: 0;
        }
        a:hover{
                color: #1cbfff;
                text-decoration: none;
                cursor: pointer;
        }
        #testWrapper{
                margin-bottom: 2em;
        }
        #startStopBtn{
                display:inline-block;
                position: relative;
                margin:0 auto;
                width:8em; height:3em;
                line-height:2.7em;
                cursor:pointer;
                box-shadow: 0 0 0 rgba(0,0,0,0.1), inset 0 0 0 rgba(0,0,0,0.1);
        }
        .start-border{
                position: absolute;
                top: 0;
                left: 0;
                width:8em;
                height:3em;
                border-radius: 5px;
                box-sizing: border-box;
                background-image: linear-gradient(#141526,#141526),linear-gradient(to bottom,#2de5d1,#1fa4e9);
                background-color: #141526;
                border: 2px transparent solid;
                background-origin: border-box;
                background-clip: content-box,border-box;
        }
        .start-text{
                position: absolute;
                margin:2px;
                top: 0;
                left: 0;
                width:calc(8em - 4px);
                height:calc(3em - 4px);
                border-radius: 5px;
                background-color: #ffffff00;
        }
        .start-text:hover{
                background-color:#151f2f;
        }
        .start-text:before{
                content:"开始测速";
        }
        #startStopBtn.running .start-text:before{
                content:"终止测速";
        }
        #test{
                margin-top:2em;
                margin-bottom:1em;
        }
        div.testArea{
                display:inline-block;
                width:16em;
                height:12.5em;
                position:relative;
                box-sizing:border-box;
        }
        div.testArea2{
                display:inline-block;
                width:14em;
                height:7em;
                position:relative;
                box-sizing:border-box;
                text-align:center;
        }
        div.testArea div.testName{
                position:absolute;
                top:0.1em; left:0;
                width:100%;
                font-size:1.4em;
                z-index:9;
        }
        div.testArea2 div.testName{
        display:block;
        text-align:center;
        font-size:1.4em;
        }
        .meterText{
                font-family: "MyriadPro",Futura,gauge-mono,"HCo Gotham SSm",Helvetica,Arial,sans-serif;
        }
        div.testArea div.meterText{
                position:absolute;
                bottom:1.55em; left:0;
                width:100%;
                font-size:2.5em;
                z-index:9;
        }
        div.testArea2 div.meterText{
        display:inline-block;
        font-size:2.5em;
        }
        div.meterText:empty:before{
                content:"0.00";
        }
        div.testArea div.unit{
                position:absolute;
                bottom:2em; left:0;
                width:100%;
                z-index:9;
        }
        div.testArea2 div.unit{
                display:inline-block;
        }
        div.testArea canvas{
                position:absolute;
                top:0; left:0; width:100%; height:100%;
                z-index:1;
        }
        div.testGroup{
                display:block;
        margin: 0 auto;
        }
        @media all and (max-width:40em){
                body{
                        font-size:0.8em;
                }
        }
    .footer {line-height: 30px; text-align: center;}
    .footer a{padding:0 6px; font-weight: 300;}
    .footer a:hover{color: green;}
    .header {line-height: 30px; text-align: center;height:50px;padding-top:50px;margin-bottom: 10px;}
    .header span>a {color:white;}
  </style>
</head>
<body>
<div class="header">
  <h1>GDUTNIC 测速网站 测速结果</h1>
<span class="layui-badge layui-bg-green"><a href="./chart.html" target="_blank">查看线性图表</a></span>
  <a href="javascript:layer.tips('线性图表用于展示不同运营商在不同时段的速度表现，程序默认保留1000条测速结果，可调大此数值以获得更准确的图表分析', '#tips', {
  tips: [3, '#3595CC'],
  time: 6000
});"><span id="tips" class="layui-badge layui-bg-black">?</span></a>
</div>

<table class="layui-hide" id="test"></table>

<script src="https://lib.baomitu.com/layui/2.5.7/layui.js" charset="utf-8"></script>

<script>
    layui.use('table', function(){
        var table = layui.table;

        table.render({
            elem: '#test'
            ,url:'./backend/results-api.php'
            ,cellMinWidth: 80
            ,cols: [[
                {field:'ip', title: 'IP地址'}
                ,{field:'isp', title: '运营商'}
                ,{field:'addr', title: '城市'}
                ,{field:'dspeed', title: '下载速度 (Mbps)', sort: true, align: 'right'}
                ,{field:'uspeed', title: '上传速度 (Mbps)', sort: true, align: 'right'}
                ,{field:'ping', title: 'Ping (ms)', sort: true, align: 'right'}
                ,{field:'jitter', title: '抖动 (ms)', sort: true, align: 'right'}
                ,{field:'created', title: '测试时间', sort: true}
            ]]
        });
    });
</script>

</body>
</html>
