    <style>

        :root {
            --bg-gradient-start: #f1f5f9;
            --bg-gradient-end: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(0, 0, 0, 0.05);
            --glass-header: rgba(255, 255, 255, 0.6);
            --blob-1: rgba(56, 189, 248, 0.3);
            --blob-2: rgba(168, 85, 247, 0.3);
            --speed-fast: #16a34a;
            --speed-fast-glow: rgba(22, 163, 74, 0.2);
            --speed-medium: #2563eb;
            --speed-medium-glow: rgba(37, 99, 235, 0.2);
            --speed-slow: #475569;
            --table-border: rgba(0, 0, 0, 0.05);
            --hover-bg: rgba(0, 0, 0, 0.03);
            --sort-icon: rgba(0, 0, 0, 0.3);
            --sort-icon-active: #334155;
            --scrollbar-track: rgba(0, 0, 0, 0.02);
            --scrollbar-thumb: rgba(0, 0, 0, 0.1);
            --scrollbar-thumb-hover: rgba(0, 0, 0, 0.2);
        }

        .dark {
            --bg-gradient-start: #0a0a0f;
            --bg-gradient-end: #0a0a0f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(20, 21, 38, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-header: rgba(15, 23, 42, 0.6);
            --blob-1: rgba(8, 145, 178, 0.2);
            --blob-2: rgba(147, 51, 234, 0.2);
            --speed-fast: #4ade80;
            --speed-fast-glow: rgba(74, 222, 128, 0.4);
            --speed-medium: #60a5fa;
            --speed-medium-glow: rgba(96, 165, 250, 0.4);
            --speed-slow: #94a3b8;
            --table-border: rgba(255, 255, 255, 0.05);
            --hover-bg: rgba(255, 255, 255, 0.05);
            --sort-icon: rgba(255, 255, 255, 0.3);
            --sort-icon-active: #ffffff;
            --scrollbar-track: rgba(255, 255, 255, 0.02);
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            background-attachment: fixed;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.06);
            transition: background 0.3s ease, border-color 0.3s ease,
                        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .dark .glass-panel {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Card hover lift effect */
        .glass-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 64px -12px rgba(15, 23, 42, 0.12);
        }
        .dark .glass-panel:hover {
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6);
        }

        /* Mouse spotlight effect */
        .glass-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.12), transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 0;
        }
        .dark .glass-panel::after {
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.08), transparent 70%);
        }
        .glass-panel:hover::after {
            opacity: 1;
        }
        /* Ensure content stays above spotlight layer */
        .glass-panel > * {
            position: relative;
            z-index: 1;
        }
        /* Allow hover popups to escape parent stacking context */
        .glass-panel > .group.relative {
            z-index: 50;
        }

        .glass-header {
            background: var(--glass-header);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--table-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Animations */
        @keyframes gradient-shift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .title-gradient {
            background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899, #06b6d4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 6s ease infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .row-enter {
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
        }

        /* Speed Glows */
        .speed-fast {
            color: var(--speed-fast);
            text-shadow: 0 0 10px var(--speed-fast-glow);
        }
        .speed-medium {
            color: var(--speed-medium);
            text-shadow: 0 0 10px var(--speed-medium-glow);
        }
        .speed-slow {
            color: var(--speed-slow);
        }

        th {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        th:hover {
            background-color: var(--hover-bg);
        }
        
        .sort-icon {
            display: inline-block;
            width: 0;
            height: 0;
            margin-left: 5px;
            vertical-align: middle;
            border-right: 4px solid transparent;
            border-left: 4px solid transparent;
            opacity: 0.3;
        }
        .sort-asc .sort-icon {
            border-bottom: 4px solid var(--sort-icon-active);
            border-top: none;
            opacity: 1;
        }
        .sort-desc .sort-icon {
            border-top: 4px solid var(--sort-icon-active);
            border-bottom: none;
            opacity: 1;
        }
        
        .blob-1 {
            background-color: var(--blob-1);
        }
        .blob-2 {
            background-color: var(--blob-2);
        }
        
        .table-row-hover:hover {
            background-color: var(--hover-bg);
        }
        
        .border-table {
            border-color: var(--table-border);
        }
        
        .divide-table > :not([hidden]) ~ :not([hidden]) {
            border-color: var(--table-border);
        }

        /* Grid background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .dark .bg-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        
        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        #theme-slider {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Detail Modal */
        .detail-modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .detail-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        .detail-modal-panel {
            transform: scale(0.95) translateY(10px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        .detail-modal.open .detail-modal-panel {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Table row clickable */
        .clickable-row {
            cursor: pointer;
        }
        .clickable-row:hover {
            background-color: var(--hover-bg);
        }

    </style>

    <script>
        // Theme Management
        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme();
        }

        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'auto';
            const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            
            // Update slider position
            const slider = document.getElementById('theme-slider');
            const btnLight = document.getElementById('btn-theme-light');
            const btnDark = document.getElementById('btn-theme-dark');
            const btnAuto = document.getElementById('btn-theme-auto');
            
            if (slider && btnLight && btnDark && btnAuto) {
                btnLight.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnDark.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnAuto.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                
                if (theme === 'light') {
                    slider.style.transform = 'translateX(0)';
                    btnLight.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else if (theme === 'dark') {
                    slider.style.transform = 'translateX(4rem)';
                    btnDark.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else {
                    slider.style.transform = 'translateX(8rem)';
                    btnAuto.classList.add('text-cyan-600', 'dark:text-cyan-400');
                }
            }
        }

        function initTheme() {
            applyTheme();
        }
        
        // Run immediately to prevent flash
        const initialTheme = localStorage.getItem('theme') || 'auto';
        if (initialTheme === 'dark' || (initialTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        document.addEventListener('DOMContentLoaded', initTheme);
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'auto' || !localStorage.getItem('theme')) {
                applyTheme();
            }
        });
    </script>

</head>

            <!-- Pagination -->
            <div class="glass-header px-6 py-4 flex items-center justify-between border-t border-table">
                <div class="text-sm text-slate-500 dark:text-slate-400">
                    共 <span id="total-count" class="text-slate-900 dark:text-white font-medium">0</span> 条记录
                </div>
                <div class="flex gap-2">
                    <button id="prev-page" class="px-3 py-1.5 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm">上一页</button>
                    <div class="flex items-center px-2 text-sm">
                        <span id="current-page">1</span> / <span id="total-pages">1</span>
                    </div>
                    <button id="next-page" class="px-3 py-1.5 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="detail-modal fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="detail-modal-backdrop absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeDetail()"></div>
        <div class="detail-modal-panel relative glass-panel rounded-3xl max-w-2xl w-full max-h-[85vh] overflow-y-auto p-6 sm:p-8">
            <!-- Close button -->
            <button onclick="closeDetail()" class="absolute top-4 right-4 w-9 h-9 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 flex items-center justify-center transition-colors z-10">
                <svg class="w-5 h-5 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div id="detail-content"></div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentSort = { column: 'dspeed', direction: 'desc' };
        let currentPage = 1;
        const itemsPerPage = 15;

        // Fetch data
        async function fetchData() {
            try {
                const response = await fetch('./backend/results-api.php');
                const result = await response.json();
                if (result.code === 0 && result.data) {
                    allData = result.data;
                    renderTable();
                    var urlParams = new URLSearchParams(window.location.search);
                    var shareId = urlParams.get('id');
                    if (shareId) {
                        openDetail(shareId);
                    }
                } else {
                    showError('获取数据失败');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                showError('网络请求错误');
            }
        }

        function showError(msg) {
            document.getElementById('table-body').innerHTML = `
                <tr>
                    <td colspan="5" class="px-6 py-12 text-center text-red-500 dark:text-red-400">
                        ${msg}
                    </td>
                </tr>
            `;
            document.getElementById('mobile-cards').innerHTML = `<div class="py-12 text-center text-red-500 dark:text-red-400">${msg}</div>`;
        }

        function getSpeedClass(speed) {
            const val = parseFloat(speed);
            if (isNaN(val)) return 'speed-slow';
            if (val >= 100) return 'speed-fast';
            if (val >= 10) return 'speed-medium';
            return 'speed-slow';
        }

        function sortData() {
            const { column, direction } = currentSort;
            allData.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];
                
                // Numeric sort for specific columns
                if (['dspeed', 'uspeed', 'ping', 'jitter'].includes(column)) {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                }
                
                if (valA < valB) return direction === 'asc' ? -1 : 1;
                if (valA > valB) return direction === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function renderTable() {
            sortData();
            
            const totalPages = Math.ceil(allData.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const pageData = allData.slice(startIdx, endIdx);
            
            const tbody = document.getElementById('table-body');
            const mobileCards = document.getElementById('mobile-cards');
            
            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-500 dark:text-slate-400">暂无数据</td></tr>`;
                mobileCards.innerHTML = `<div class="py-8 text-center text-slate-500 dark:text-slate-400">暂无数据</div>`;
            } else {
                tbody.innerHTML = pageData.map((row, index) => `
                    <tr class="clickable-row transition-colors row-enter" style="animation-delay: ${index * 0.03}s" data-id="${row._id}" onclick="openDetail(${row._id})">
                        <td class="px-6 py-4 text-slate-700 dark:text-slate-300 font-mono text-xs">${row.ip || '-'}</td>
                        <td class="px-6 py-4 text-slate-500 dark:text-slate-400">${row.addr || '-'}</td>
                        <td class="px-6 py-4 text-right font-medium ${getSpeedClass(row.dspeed)}">${row.dspeed || '0.00'}</td>
                        <td class="px-6 py-4 text-right font-medium ${getSpeedClass(row.uspeed)}">${row.uspeed || '0.00'}</td>
                        <td class="px-6 py-4 text-slate-500 dark:text-slate-400 text-xs">${row.created || '-'}</td>
                    </tr>
                `).join('');

                mobileCards.innerHTML = pageData.map((row, index) => `
                    <div class="rounded-xl border border-table p-4 space-y-3 row-enter clickable-row" style="animation-delay: ${index * 0.03}s" data-id="${row._id}" onclick="openDetail(${row._id})">
                        <div class="flex items-center justify-between gap-2">
                            <span class="font-mono text-xs text-slate-700 dark:text-slate-300 truncate">${row.ip || '-'}</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 shrink-0">${row.created || '-'}</span>
                        </div>
                        <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                            <span class="flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                ${row.addr || '-'}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-1 pt-2 border-t border-table">
                            <div class="text-center">
                                <div class="text-[10px] text-slate-400 dark:text-slate-500 mb-0.5">下载</div>
                                <div class="text-sm font-medium ${getSpeedClass(row.dspeed)}">${row.dspeed || '0.00'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] text-slate-400 dark:text-slate-500 mb-0.5">上传</div>
                                <div class="text-sm font-medium ${getSpeedClass(row.uspeed)}">${row.uspeed || '0.00'}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            // Update pagination UI
            document.getElementById('total-count').textContent = allData.length;
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
            
            document.getElementById('prev-page').disabled = currentPage === 1;
            document.getElementById('next-page').disabled = currentPage === totalPages;
            
            // Update sort icons
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === currentSort.column) {
                    th.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        // Event Listeners
        document.querySelectorAll('th').forEach(th => {
            th.addEventListener('click', () => {
                const column = th.dataset.sort;
                if (!column) return;
                
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'desc';
                }
                renderTable();
            });
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });

        document.getElementById('next-page').addEventListener('click', () => {
            const totalPages = Math.ceil(allData.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        // Detail Modal
        var detailMap = null;
        var currentDetailId = null;

        function isPrivateIP(ip) {
            if (!ip) return false;
            if (ip === '::1' || ip.indexOf('127.') === 0 || ip.indexOf('localhost') !== -1) return true;
            if (ip.indexOf('10.') === 0) return true;
            if (ip.indexOf('192.168.') === 0) return true;
            if (/^172\.(1[6-9]|2\d|3[01])\./.test(ip)) return true;
            if (ip.indexOf('fe80:') === 0) return true;
            return false;
        }

        function openDetail(id) {
            var record = allData.find(function(r) { return r._id == id; });
            if (!record) {
                document.getElementById('detail-content').innerHTML = '<div class="py-12 text-center text-slate-500 dark:text-slate-400">该记录已过期或不存在</div>';
            } else {
                renderDetailContent(record);
            }

            var modal = document.getElementById('detailModal');
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
            currentDetailId = id;

            var url = new URL(window.location.href);
            url.searchParams.set('id', id);
            history.replaceState(null, '', url);
        }

        function closeDetail() {
            var modal = document.getElementById('detailModal');
            modal.classList.remove('open');
            document.body.style.overflow = '';
            currentDetailId = null;

            if (detailMap) {
                detailMap.remove();
                detailMap = null;
            }

            var url = new URL(window.location.href);
            url.searchParams.delete('id');
            history.replaceState(null, '', url);
        }

        function renderDetailContent(r) {
            var addrParts = (r.addr || '').split(',');
            var city = addrParts[addrParts.length - 1] || r.addr || '-';
            var region = addrParts.length > 1 ? addrParts[addrParts.length - 2] : '';
            var country = addrParts.length > 2 ? addrParts[0] : '';

            var hasCoords = r.lat && r.lon && parseFloat(r.lat) !== 0 && parseFloat(r.lon) !== 0;
            var showMap = hasCoords;
            var mapPlaceholder = '';

            if (!showMap) {
                if (isPrivateIP(r.ip)) {
                    mapPlaceholder = '<div class="flex items-center justify-center h-[280px] rounded-xl bg-black/5 dark:bg-white/5 text-sm text-slate-500 dark:text-slate-400">该测速记录的 IP 为内网 IP，无法展示地图数据</div>';
                } else {
                    mapPlaceholder = '<div class="flex items-center justify-center h-[280px] rounded-xl bg-black/5 dark:bg-white/5 text-sm text-slate-500 dark:text-slate-400">该记录无位置数据</div>';
                }
            }

            var shareUrl = window.location.origin + window.location.pathname + '?id=' + r._id;

            document.getElementById('detail-content').innerHTML = `
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-1">测速详情</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">记录 ID: ${r._id || '-'}</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="rounded-2xl bg-cyan-500/10 dark:bg-cyan-500/15 p-4 text-center">
                        <div class="text-xs text-cyan-600 dark:text-cyan-400 mb-1">下载速度</div>
                        <div class="text-3xl font-bold font-mono text-cyan-600 dark:text-cyan-400">${parseFloat(r.dspeed).toFixed(2)}</div>
                        <div class="text-xs text-cyan-600/60 dark:text-cyan-400/60">Mbps</div>
                    </div>
                    <div class="rounded-2xl bg-purple-500/10 dark:bg-purple-500/15 p-4 text-center">
                        <div class="text-xs text-purple-600 dark:text-purple-400 mb-1">上传速度</div>
                        <div class="text-3xl font-bold font-mono text-purple-600 dark:text-purple-400">${parseFloat(r.uspeed).toFixed(2)}</div>
                        <div class="text-xs text-purple-600/60 dark:text-purple-400/60">Mbps</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="rounded-xl bg-black/5 dark:bg-white/5 p-3 text-center">
                        <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">Ping</div>
                        <div class="text-lg font-medium font-mono text-slate-700 dark:text-slate-300">${parseFloat(r.ping).toFixed(2)} ms</div>
                    </div>
                    <div class="rounded-xl bg-black/5 dark:bg-white/5 p-3 text-center">
                        <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">抖动</div>
                        <div class="text-lg font-medium font-mono text-slate-700 dark:text-slate-300">${parseFloat(r.jitter).toFixed(2)} ms</div>
                    </div>
                </div>

                <div class="rounded-xl bg-black/5 dark:bg-white/5 p-4 mb-6 space-y-2 text-sm">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-slate-500 dark:text-slate-400 shrink-0">IP 地址</span>
                        <span class="font-mono text-slate-800 dark:text-slate-200">${r.ip || '-'}</span>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-slate-500 dark:text-slate-400 shrink-0">运营商</span>
                        <span class="text-slate-800 dark:text-slate-200 text-right">${r.isp || '-'}</span>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-slate-500 dark:text-slate-400 shrink-0">国家/地区</span>
                        <span class="text-slate-800 dark:text-slate-200 text-right">${country || '-'}</span>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-slate-500 dark:text-slate-400 shrink-0">省份</span>
                        <span class="text-slate-800 dark:text-slate-200 text-right">${region || '-'}</span>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-slate-500 dark:text-slate-400 shrink-0">城市</span>
                        <span class="text-slate-800 dark:text-slate-200 text-right">${city || '-'}</span>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-slate-500 dark:text-slate-400 shrink-0">客户端类型</span>
                        <span class="text-right">${r.client_type === 'cli' ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-purple-500/10 text-purple-600 dark:text-purple-400 text-xs font-medium"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>命令行工具</span>' : r.client_type === 'web' ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 text-xs font-medium"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.6 9h16.8M3.6 15h16.8M11 3a17 17 0 000 18M13 3a17 17 0 010 18"></path></svg>浏览器</span>' : '<span class="text-slate-500 dark:text-slate-400 text-xs">未知</span>'}</span>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-slate-500 dark:text-slate-400 shrink-0">测速时间</span>
                        <span class="text-slate-800 dark:text-slate-200 text-right">${r.created || '-'}</span>
                    </div>
                </div>

                <div class="mb-6">
                    <div class="text-sm font-medium text-slate-700 dark:text-slate-200 mb-2">位置地图</div>
                    ${showMap ? '<div id="detail-map" class="h-[280px] rounded-xl overflow-hidden"></div>' : mapPlaceholder}
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="copyShareUrl()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 transition-colors text-sm font-medium text-slate-700 dark:text-slate-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        复制分享链接
                    </button>
                    <span id="share-url-text" class="text-xs text-slate-400 dark:text-slate-500 truncate hidden sm:inline">${shareUrl}</span>
                </div>
            `;

            if (showMap) {
                setTimeout(function() { renderMap(parseFloat(r.lat), parseFloat(r.lon), city); }, 100);
            }
        }

        function renderMap(lat, lon, label) {
            if (detailMap) {
                detailMap.remove();
                detailMap = null;
            }

            var isDark = document.documentElement.classList.contains('dark');
            var tileStyle = isDark ? 8 : 7;
            var tileUrl = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=' + tileStyle + '&x={x}&y={y}&z={z}';
            var subdomains = ['1', '2', '3', '4'];

            detailMap = L.map('detail-map', {
                center: [lat, lon],
                zoom: 11,
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer(tileUrl, { subdomains: subdomains, maxZoom: 18 }).addTo(detailMap);

            var marker = L.marker([lat, lon]).addTo(detailMap);
            if (label) marker.bindPopup(label);

            setTimeout(function() { detailMap.invalidateSize(); }, 200);
        }

        function copyShareUrl() {
            var url = window.location.origin + window.location.pathname + '?id=' + currentDetailId;
            navigator.clipboard.writeText(url).then(function() {
                var btn = event.currentTarget;
                var originalHTML = btn.innerHTML;
                btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>已复制';
                setTimeout(function() { btn.innerHTML = originalHTML; }, 2000);
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDetail();
        });

        // Init
        fetchData();

        // Mouse spotlight effect — update CSS variables on hover
        document.addEventListener("mousemove", function (e) {
            var el = e.target.closest(".glass-panel");
            if (!el) return;
            var rect = el.getBoundingClientRect();
            var x = (e.clientX - rect.left) / rect.width * 100;
            var y = (e.clientY - rect.top) / rect.height * 100;
            el.style.setProperty("--mouse-x", x + "%");
            el.style.setProperty("--mouse-y", y + "%");
        });
    </script>
</body>
</html>
