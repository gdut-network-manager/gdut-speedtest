<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>测速结果 | GDUTNIC 测速网站</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            background-attachment: fixed;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .row-enter {
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
        }

        /* Speed Glows */
        .speed-fast {
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
        }
        .speed-medium {
            color: #60a5fa;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
        }
        .speed-slow {
            color: #94a3b8;
        }

        th {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        th:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .sort-icon {
            display: inline-block;
            width: 0;
            height: 0;
            margin-left: 5px;
            vertical-align: middle;
            border-right: 4px solid transparent;
            border-left: 4px solid transparent;
            opacity: 0.3;
        }
        .sort-asc .sort-icon {
            border-bottom: 4px solid #fff;
            border-top: none;
            opacity: 1;
        }
        .sort-desc .sort-icon {
            border-top: 4px solid #fff;
            border-bottom: none;
            opacity: 1;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto animate-fade-in">
        <!-- Header Island -->
        <div class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden">
            <!-- Decorative glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            
            <div class="relative z-10">
                <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                    GDUTNIC 测速结果
                </h1>
                <p class="text-slate-400 text-sm mt-1">网络速度监控仪表盘</p>
            </div>
            
            <div class="flex items-center gap-4 relative z-10">
                <a href="./chart.html" target="_blank" class="px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition-all duration-300 flex items-center gap-2 text-sm font-medium group">
                    <svg class="w-4 h-4 text-blue-400 group-hover:text-blue-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                    查看线性图表
                </a>
                <div class="group relative">
                    <button class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center transition-all duration-300 text-slate-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                    <div class="absolute right-0 top-12 w-64 p-3 rounded-xl glass-panel text-xs text-slate-300 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
                        线性图表用于展示不同运营商在不同时段的速度表现，程序默认保留1000条测速结果，可调大此数值以获得更准确的图表分析。
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Island -->
        <div class="glass-panel rounded-2xl overflow-hidden flex flex-col">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="glass-header text-xs uppercase tracking-wider text-slate-400">
                            <th class="px-6 py-4 font-medium" data-sort="ip">IP地址 <span class="sort-icon"></span></th>
                            <th class="px-6 py-4 font-medium" data-sort="isp">运营商 <span class="sort-icon"></span></th>
                            <th class="px-6 py-4 font-medium" data-sort="addr">城市 <span class="sort-icon"></span></th>
                            <th class="px-6 py-4 font-medium text-right" data-sort="dspeed">下载 (Mbps) <span class="sort-icon"></span></th>
                            <th class="px-6 py-4 font-medium text-right" data-sort="uspeed">上传 (Mbps) <span class="sort-icon"></span></th>
                            <th class="px-6 py-4 font-medium text-right" data-sort="ping">Ping (ms) <span class="sort-icon"></span></th>
                            <th class="px-6 py-4 font-medium text-right" data-sort="jitter">抖动 (ms) <span class="sort-icon"></span></th>
                            <th class="px-6 py-4 font-medium" data-sort="created">测试时间 <span class="sort-icon"></span></th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-white/5 text-sm">
                        <!-- Loading State -->
                        <tr>
                            <td colspan="8" class="px-6 py-12 text-center text-slate-400">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span>加载数据中...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="glass-header px-6 py-4 flex items-center justify-between border-t border-white/5">
                <div class="text-sm text-slate-400">
                    共 <span id="total-count" class="text-white font-medium">0</span> 条记录
                </div>
                <div class="flex gap-2">
                    <button id="prev-page" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm">上一页</button>
                    <div class="flex items-center px-2 text-sm">
                        <span id="current-page">1</span> / <span id="total-pages">1</span>
                    </div>
                    <button id="next-page" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentSort = { column: 'created', direction: 'desc' };
        let currentPage = 1;
        const itemsPerPage = 15;

        // Fetch data
        async function fetchData() {
            try {
                const response = await fetch('./backend/results-api.php');
                const result = await response.json();
                if (result.code === 0 && result.data) {
                    allData = result.data;
                    renderTable();
                } else {
                    showError('获取数据失败');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                showError('网络请求错误');
            }
        }

        function showError(msg) {
            document.getElementById('table-body').innerHTML = `
                <tr>
                    <td colspan="8" class="px-6 py-12 text-center text-red-400">
                        ${msg}
                    </td>
                </tr>
            `;
        }

        function getSpeedClass(speed) {
            const val = parseFloat(speed);
            if (isNaN(val)) return 'speed-slow';
            if (val >= 100) return 'speed-fast';
            if (val >= 10) return 'speed-medium';
            return 'speed-slow';
        }

        function sortData() {
            const { column, direction } = currentSort;
            allData.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];
                
                // Numeric sort for specific columns
                if (['dspeed', 'uspeed', 'ping', 'jitter'].includes(column)) {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                }
                
                if (valA < valB) return direction === 'asc' ? -1 : 1;
                if (valA > valB) return direction === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function renderTable() {
            sortData();
            
            const totalPages = Math.ceil(allData.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const pageData = allData.slice(startIdx, endIdx);
            
            const tbody = document.getElementById('table-body');
            
            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-8 text-center text-slate-400">暂无数据</td></tr>`;
            } else {
                tbody.innerHTML = pageData.map((row, index) => `
                    <tr class="hover:bg-white/5 transition-colors row-enter" style="animation-delay: ${index * 0.03}s">
                        <td class="px-6 py-4 text-slate-300 font-mono text-xs">${row.ip || '-'}</td>
                        <td class="px-6 py-4 text-slate-200">${row.isp || '-'}</td>
                        <td class="px-6 py-4 text-slate-400">${row.addr || '-'}</td>
                        <td class="px-6 py-4 text-right font-medium ${getSpeedClass(row.dspeed)}">${row.dspeed || '0.00'}</td>
                        <td class="px-6 py-4 text-right font-medium ${getSpeedClass(row.uspeed)}">${row.uspeed || '0.00'}</td>
                        <td class="px-6 py-4 text-right text-slate-300">${row.ping || '0.00'}</td>
                        <td class="px-6 py-4 text-right text-slate-400">${row.jitter || '0.00'}</td>
                        <td class="px-6 py-4 text-slate-400 text-xs">${row.created || '-'}</td>
                    </tr>
                `).join('');
            }
            
            // Update pagination UI
            document.getElementById('total-count').textContent = allData.length;
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
            
            document.getElementById('prev-page').disabled = currentPage === 1;
            document.getElementById('next-page').disabled = currentPage === totalPages;
            
            // Update sort icons
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === currentSort.column) {
                    th.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        // Event Listeners
        document.querySelectorAll('th').forEach(th => {
            th.addEventListener('click', () => {
                const column = th.dataset.sort;
                if (!column) return;
                
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'desc';
                }
                renderTable();
            });
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });

        document.getElementById('next-page').addEventListener('click', () => {
            const totalPages = Math.ceil(allData.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        // Init
        fetchData();
    </script>
</body>
</html>
