    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],

    <script src="echarts/echarts.min.js"></script>
    <style>

        :root {
            --bg-gradient-start: #f1f5f9;
            --bg-gradient-end: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(0, 0, 0, 0.05);
            --blob-1: rgba(56, 189, 248, 0.1);
            --blob-2: rgba(251, 113, 133, 0.1);
        }

        .dark {
            --bg-gradient-start: #0a0a0f;
            --bg-gradient-end: #0a0a0f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(20, 21, 38, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blob-1: rgba(8, 145, 178, 0.2);
            --blob-2: rgba(147, 51, 234, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            background-attachment: fixed;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.06);
            transition: background 0.3s ease, border-color 0.3s ease,
                        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .dark .glass-panel {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Card hover lift effect */
        .glass-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 64px -12px rgba(15, 23, 42, 0.12);
        }
        .dark .glass-panel:hover {
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6);
        }

        /* Mouse spotlight effect */
        .glass-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.12), transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 0;
        }
        .dark .glass-panel::after {
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.08), transparent 70%);
        }
        .glass-panel:hover::after {
            opacity: 1;
        }
        /* Ensure content stays above spotlight layer */
        .glass-panel > * {
            position: relative;
            z-index: 1;
        }
        /* Allow hover popups to escape parent stacking context */
        .glass-panel > .group.relative {
            z-index: 50;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .chart-container {
            position: relative;
            height: 70vh;
            width: 100%;
        }
        
        .blob-1 {
            background-color: var(--blob-1);
        }
        .blob-2 {
            background-color: var(--blob-2);
        }

        /* Grid background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .dark .bg-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        
        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        #theme-slider {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

    </style>

    <script>
        // Theme Management
        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme();
        }

        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'auto';
            const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            
            // Update slider position
            const slider = document.getElementById('theme-slider');
            const btnLight = document.getElementById('btn-theme-light');
            const btnDark = document.getElementById('btn-theme-dark');
            const btnAuto = document.getElementById('btn-theme-auto');
            
            if (slider && btnLight && btnDark && btnAuto) {
                btnLight.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnDark.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnAuto.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                
                if (theme === 'light') {
                    slider.style.transform = 'translateX(0)';
                    btnLight.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else if (theme === 'dark') {
                    slider.style.transform = 'translateX(4rem)';
                    btnDark.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else {
                    slider.style.transform = 'translateX(8rem)';
                    btnAuto.classList.add('text-cyan-600', 'dark:text-cyan-400');
                }
            }

            // Update chart if it exists
            if (chartInstance) {
                updateChartTheme(isDark);
            }
        }

        function initTheme() {
            applyTheme();
            
            const isDark = document.documentElement.classList.contains("dark");
            updateChartTheme(isDark);
        }
        
        // Run immediately to prevent flash
        const initialTheme = localStorage.getItem('theme') || 'auto';
        if (initialTheme === 'dark' || (initialTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        document.addEventListener('DOMContentLoaded', initTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'auto' || !localStorage.getItem('theme')) {
                applyTheme();
            }
        });
    </script>

</head>
<body class="p-4 md:p-8 overflow-x-hidden relative selection:bg-cyan-500/30">

    <!-- Ambient Background -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-grid opacity-30 dark:opacity-30"></div>
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-sky-400/10 dark:bg-cyan-600/20 rounded-full blur-[120px] animate-pulse-glow"></div>

        <!-- Chart Island -->
        <div class="glass-panel rounded-3xl p-4 md:p-6 relative overflow-hidden">
            <!-- Speed Mode Toggle -->
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    <span id="speed-mode-label">下载速度</span>

                    <button id="btn-mode-dl" onclick="switchMode('dl')" class="relative z-10 w-16 h-7 flex items-center justify-center text-xs font-medium text-cyan-600 dark:text-cyan-400 transition-colors">下载</button>
                    <button id="btn-mode-ul" onclick="switchMode('ul')" class="relative z-10 w-16 h-7 flex items-center justify-center text-xs font-medium text-slate-600 dark:text-gray-400 transition-colors">上传</button>

    <script>
        var ISP_COLORS = [
            { primary: '#22d3ee', secondary: '#0891b2' },
            { primary: '#a78bfa', secondary: '#7c3aed' },
            { primary: '#34d399', secondary: '#059669' },
            { primary: '#f472b6', secondary: '#db2777' },
            { primary: '#fbbf24', secondary: '#d97706' },
            { primary: '#60a5fa', secondary: '#2563eb' },
            { primary: '#f87171', secondary: '#dc2626' },
            { primary: '#c084fc', secondary: '#9333ea' }
        ];

        var rawAllData = [];
        var chartInstance = null;
        var currentMode = 'dl';
        var currentIspOrder = [];

        function buildDatasets(mode) {
            var data_sorted = {};
            for (var i = 0; i < rawAllData.length; i++) {
                var d = rawAllData[i];
                var parts = d.isp ? d.isp.split(' ') : ['未知'];
                var ispName = parts.length > 1 ? parts[0] + ' ' + parts[1] : parts[0];
                if (!data_sorted[ispName]) data_sorted[ispName] = [];
                data_sorted[ispName].push(d);
            }

            var ispKeys = Object.keys(data_sorted);
            ispKeys.sort(function(a, b) { return data_sorted[b].length - data_sorted[a].length; });
            currentIspOrder = ispKeys;

            var datasets = [];
            for (var i = 0; i < ispKeys.length; i++) {
                var isp = ispKeys[i];
                var points = data_sorted[isp];
                var colorIdx = i % ISP_COLORS.length;
                var c = ISP_COLORS[colorIdx];
                var data = [];
                for (var j = 0; j < points.length; j++) {
                    var p = points[j];
                    var timeParts = p.created.split(' ')[1].split(':');
                    var x = parseFloat(timeParts[0]) + parseFloat(timeParts[1]) / 60 + parseFloat(timeParts[2]) / 3600;
                    var y = parseFloat(mode === 'dl' ? p.dspeed : p.uspeed) || 0;
                    data.push({ value: [x, y], rawData: p });
                }

                datasets.push({
                    name: isp,
                    type: 'scatter',
                    data: data,
                    symbolSize: 8,
                    itemStyle: {
                        color: {
                            type: 'radial',
                            x: 0.5, y: 0.5, r: 0.5,
                            colorStops: [
                                { offset: 0, color: c.primary },
                                { offset: 1, color: c.primary + '20' }
                            ]
                        },
                        shadowBlur: 8,
                        shadowColor: c.primary + '80'
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 16,
                            shadowColor: c.primary
                        },
                        scale: 1.4
                    }
                });
            }
            return datasets;
        }

        function getTooltipHtml(params) {
            var d = params.data.rawData;
            var colorIdx = currentIspOrder.indexOf(params.seriesName);
            var c = ISP_COLORS[colorIdx % ISP_COLORS.length];
            var fields = [
                { label: '运营商', value: d.isp || '-' },
                { label: 'IP 地址', value: d.ip || '-' },
                { label: '城市', value: d.addr || '-' },
                { label: '下载', value: (d.dspeed || '0.00') + ' Mbps' },
                { label: '上传', value: (d.uspeed || '0.00') + ' Mbps' },
                { label: 'Ping', value: (d.ping || '0.00') + ' ms' },
                { label: '抖动', value: (d.jitter || '0.00') + ' ms' },
                { label: '时间', value: d.created || '-' }
            ];

            var html = '<div style="border-left:3px solid ' + c.primary + ';padding-left:10px;">';
            for (var i = 0; i < fields.length; i++) {
                var f = fields[i];
                var isNumeric = ['下载', '上传', 'Ping', '抖动'].indexOf(f.label) !== -1;
                var valueStyle = isNumeric
                    ? 'font-family:JetBrains Mono,monospace;color:#f1f5f9;font-weight:600'
                    : 'color:#cbd5e1';
                html += '<div style="display:flex;justify-content:space-between;gap:16px;line-height:1.6;">'
                    + '<span style="color:#94a3b8;font-size:12px;">' + f.label + '</span>'
                    + '<span style="' + valueStyle + ';font-size:12px;">' + f.value + '</span>'
                    + '</div>';
            }
            html += '</div>';
            return html;
        }

        function getBaseOption(isDark) {
            var axisLabelColor = isDark ? '#94a3b8' : '#64748b';
            var axisLineColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
            var splitLineColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
            var tooltipBg = isDark ? 'rgba(15,23,42,0.85)' : 'rgba(255,255,255,0.85)';
            var tooltipBorder = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)';

            var yLabel = currentMode === 'dl' ? '下载速度 (Mbps)' : '上传速度 (Mbps)';

            return {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: tooltipBg,
                    borderColor: tooltipBorder,
                    borderWidth: 1,
                    padding: [8, 12],
                    borderRadius: 12,
                    extraCssText: 'backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,0.2);',
                    formatter: getTooltipHtml
                },
                legend: {
                    show: true,
                    top: 0,
                    textStyle: { color: axisLabelColor, fontSize: 12, fontFamily: 'Inter, sans-serif' },
                    icon: 'circle',
                    itemWidth: 10,
                    itemHeight: 10,
                    itemGap: 16
                },
                grid: {
                    top: 40,
                    bottom: 70,
                    left: 60,
                    right: 30,
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    min: 0,
                    max: 24,
                    interval: 3,
                    axisLine: { lineStyle: { color: axisLineColor } },
                    axisTick: { show: false },
                    axisLabel: {
                        color: axisLabelColor,
                        formatter: function(val) {
                            var h = Math.floor(val);
                            return (h < 10 ? '0' : '') + h + ':00';
                        }
                    },
                    splitLine: { lineStyle: { color: splitLineColor, type: 'dashed' } }
                },
                yAxis: {
                    type: 'value',
                    name: yLabel,
                    nameTextStyle: { color: axisLabelColor, fontSize: 12, padding: [0, 0, 8, 0] },
                    axisLine: { lineStyle: { color: axisLineColor } },
                    axisTick: { show: false },
                    axisLabel: {
                        color: axisLabelColor,
                        formatter: '{value}'
                    },
                    splitLine: { lineStyle: { color: splitLineColor, type: 'dashed' } }
                },
                dataZoom: [
                    {
                        type: 'slider',
                        xAxisIndex: 0,
                        bottom: 10,
                        height: 22,
                        start: 0,
                        end: 100,
                        borderColor: 'transparent',
                        backgroundColor: isDark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)',
                        fillerColor: isDark ? 'rgba(34,211,238,0.1)' : 'rgba(6,182,212,0.08)',
                        handleStyle: { color: isDark ? '#22d3ee' : '#0891b2', borderColor: 'transparent' },
                        textStyle: { color: axisLabelColor, fontSize: 10 },
                        dataBackground: {
                            lineStyle: { color: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)' },
                            areaStyle: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' }
                        }
                    },
                    {
                        type: 'inside',
                        xAxisIndex: 0,
                        start: 0,
                        end: 100
                    }
                ],
                animation: true,
                animationDuration: 800,
                animationEasing: 'cubicOut'
            };
        }

        function renderChart() {
            var isDark = document.documentElement.classList.contains('dark');
            var datasets = buildDatasets(currentMode);
            var option = getBaseOption(isDark);
            option.series = datasets;

            if (!chartInstance) {
                var container = document.getElementById('canvas');
                chartInstance = echarts.init(container);
            }
            chartInstance.setOption(option, true);
        }

        function switchMode(mode) {
            if (mode === currentMode) return;
            currentMode = mode;
            var slider = document.getElementById('speed-slider');
            var btnDl = document.getElementById('btn-mode-dl');
            var btnUl = document.getElementById('btn-mode-ul');
            var label = document.getElementById('speed-mode-label');

            if (mode === 'dl') {
                slider.style.transform = 'translateX(0)';
                btnDl.classList.remove('text-slate-600', 'dark:text-gray-400');
                btnDl.classList.add('text-cyan-600', 'dark:text-cyan-400');
                btnUl.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnUl.classList.add('text-slate-600', 'dark:text-gray-400');
                label.textContent = '下载速度';
            } else {
                slider.style.transform = 'translateX(4rem)';
                btnUl.classList.remove('text-slate-600', 'dark:text-gray-400');
                btnUl.classList.add('text-cyan-600', 'dark:text-cyan-400');
                btnDl.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnDl.classList.add('text-slate-600', 'dark:text-gray-400');
                label.textContent = '上传速度';
            }

            renderChart();
        }

        function showEmpty(message) {
            if (!chartInstance) return;
            chartInstance.setOption({
                title: {
                    text: message,
                    left: 'center',
                    top: 'center',
                    textStyle: {
                        color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b',
                        fontSize: 16,
                        fontWeight: 'normal',
                        fontFamily: 'Inter, sans-serif'
                    }
                }
            });
        }

        async function mainfunc() {
            var container = document.getElementById('canvas');
            chartInstance = echarts.init(container);
            chartInstance.showLoading('default', {
                text: '加载中...',
                color: '#22d3ee',
                textColor: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b',
                maskColor: document.documentElement.classList.contains('dark') ? 'rgba(10,10,15,0.6)' : 'rgba(255,255,255,0.6)',
                fontSize: 14,
                fontFamily: 'Inter, sans-serif'
            });

            try {
                var datareq = await fetch('backend/results-api.php');
                var dataraw = await datareq.json();
                if (dataraw.code !== 0 || !dataraw.data || dataraw.data.length === 0) {
                    chartInstance.hideLoading();
                    showEmpty('暂无测速数据');
                    return;
                }
                rawAllData = dataraw.data;
                chartInstance.hideLoading();
                renderChart();
            } catch (e) {
                chartInstance.hideLoading();
                showEmpty('数据加载失败');
            }
        }

        function updateChartTheme(isDark) {
            if (!chartInstance) return;
            var option = getBaseOption(isDark);
            option.series = buildDatasets(currentMode);
            chartInstance.setOption(option, true);
        }


        window.onload = function() {
            mainfunc();
        };

        window.addEventListener('resize', function() {
            if (chartInstance) chartInstance.resize();
        });

        // Mouse spotlight effect — update CSS variables on hover
        document.addEventListener("mousemove", function (e) {
            var el = e.target.closest(".glass-panel");
            if (!el) return;
            var rect = el.getBoundingClientRect();
            var x = (e.clientX - rect.left) / rect.width * 100;
            var y = (e.clientY - rect.top) / rect.height * 100;
            el.style.setProperty("--mouse-x", x + "%");
            el.style.setProperty("--mouse-y", y + "%");
        });
    </script>
</body>
</html>
