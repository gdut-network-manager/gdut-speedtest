<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>运营商速度趋势 | 广东工业大学测速网站</title>
    <link rel="icon" href="logo.png" sizes="32x32" />
    <link rel="icon" href="logo.png" sizes="192x192" />
    <link rel="apple-touch-icon-precomposed" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
                        mono: ['JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', 'monospace'],
                    },
                }
            }
        }
    </script>
    <script src="chartjs/Chart.min.js"></script>
    <script src="chartjs/utils.js"></script>
    <style>

        :root {
            --bg-gradient-start: #f1f5f9;
            --bg-gradient-end: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(0, 0, 0, 0.05);
            --blob-1: rgba(56, 189, 248, 0.1);
            --blob-2: rgba(251, 113, 133, 0.1);
        }

        .dark {
            --bg-gradient-start: #0a0a0f;
            --bg-gradient-end: #0a0a0f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(20, 21, 38, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blob-1: rgba(8, 145, 178, 0.2);
            --blob-2: rgba(147, 51, 234, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            background-attachment: fixed;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.06);
            transition: background 0.3s ease, border-color 0.3s ease,
                        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .dark .glass-panel {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Card hover lift effect */
        .glass-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 64px -12px rgba(15, 23, 42, 0.12);
        }
        .dark .glass-panel:hover {
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6);
        }

        /* Mouse spotlight effect */
        .glass-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.12), transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 0;
        }
        .dark .glass-panel::after {
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.08), transparent 70%);
        }
        .glass-panel:hover::after {
            opacity: 1;
        }
        /* Ensure content stays above spotlight layer */
        .glass-panel > * {
            position: relative;
            z-index: 1;
        }
        /* Allow hover popups to escape parent stacking context */
        .glass-panel > .group.relative {
            z-index: 50;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .chart-container {
            position: relative;
            height: 70vh;
            width: 100%;
        }
        
        .blob-1 {
            background-color: var(--blob-1);
        }
        .blob-2 {
            background-color: var(--blob-2);
        }

        /* Grid background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .dark .bg-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        
        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        #theme-slider {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

    </style>

    <script>
        // Theme Management
        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme();
        }

        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'auto';
            const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            
            // Update slider position
            const slider = document.getElementById('theme-slider');
            const btnLight = document.getElementById('btn-theme-light');
            const btnDark = document.getElementById('btn-theme-dark');
            const btnAuto = document.getElementById('btn-theme-auto');
            
            if (slider && btnLight && btnDark && btnAuto) {
                btnLight.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnDark.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnAuto.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                
                if (theme === 'light') {
                    slider.style.transform = 'translateX(0)';
                    btnLight.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else if (theme === 'dark') {
                    slider.style.transform = 'translateX(4rem)';
                    btnDark.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else {
                    slider.style.transform = 'translateX(8rem)';
                    btnAuto.classList.add('text-cyan-600', 'dark:text-cyan-400');
                }
            }

            // Update chart if it exists
            if (window.myScatter) {
                updateChartTheme(isDark);
            }
        }

        function initTheme() {
            applyTheme();
            
            const isDark = document.documentElement.classList.contains("dark");
            updateChartTheme(isDark);
        }
        
        // Run immediately to prevent flash
        const initialTheme = localStorage.getItem('theme') || 'auto';
        if (initialTheme === 'dark' || (initialTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        document.addEventListener('DOMContentLoaded', initTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'auto' || !localStorage.getItem('theme')) {
                applyTheme();
            }
        });
    </script>

</head>
<body class="p-4 md:p-8 overflow-x-hidden relative selection:bg-cyan-500/30">

    <!-- Ambient Background -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-grid opacity-30 dark:opacity-30"></div>
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-sky-400/10 dark:bg-cyan-600/20 rounded-full blur-[120px] animate-pulse-glow"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-rose-400/10 dark:bg-purple-600/20 rounded-full blur-[120px] animate-pulse-glow" style="animation-delay: 3s;"></div>
    </div>

    <div class="relative z-10 max-w-7xl mx-auto animate-fade-in">
        <!-- Header Island -->
        <div class="glass-panel rounded-3xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 blob-1 rounded-full mix-blend-multiply filter blur-3xl"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 blob-2 rounded-full mix-blend-multiply filter blur-3xl"></div>
            
            <div class="relative z-10">
                <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                    运营商速度趋势
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">24小时网络速度分布图表</p>
            </div>
            
            
            <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 relative z-10">
                <!-- Theme Switcher -->
                <div class="relative flex items-center bg-black/5 dark:bg-black/40 p-1 rounded-full border border-black/10 dark:border-white/10 shadow-inner">
                    <div id="theme-slider" class="absolute h-7 w-16 bg-white dark:bg-white/10 rounded-full shadow-sm transition-transform duration-300 ease-out"></div>
                    <button onclick="setTheme('light')" id="btn-theme-light" class="theme-btn relative z-10 w-16 h-7 flex items-center justify-center text-xs font-medium text-slate-600 dark:text-gray-400 transition-colors" data-theme="light">☀️ 浅色</button>
                    <button onclick="setTheme('dark')" id="btn-theme-dark" class="theme-btn relative z-10 w-16 h-7 flex items-center justify-center text-xs font-medium text-slate-600 dark:text-gray-400 transition-colors" data-theme="dark">🌙 深色</button>
                    <button onclick="setTheme('auto')" id="btn-theme-auto" class="theme-btn relative z-10 w-16 h-7 flex items-center justify-center text-xs font-medium text-slate-600 dark:text-gray-400 transition-colors" data-theme="auto">💻 自动</button>
                </div>

                <a href="./results.html" class="px-5 py-2.5 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 transition-all duration-300 flex items-center gap-2 text-sm font-medium group">
                    <svg class="w-4 h-4 text-blue-400 group-hover:text-blue-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    返回数据列表
                </a>
            </div>

        </div>

        <!-- Chart Island -->
        <div class="glass-panel rounded-3xl p-4 md:p-6 relative overflow-hidden">
            <div class="chart-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function mainfunc() {
            var color = Chart.helpers.color;
            var datareq = await fetch('backend/results-api.php');
            var dataraw = await datareq.text();
            
            try {
                dataraw = JSON.parse(dataraw);
            } catch {
                alert("Can't get data");
                return 0;
            }

            let data_sorted = {};
            for (const data of dataraw["data"]) {
                let data_isp = data["isp"].split(" ").length > 1 ? data["isp"].split(" ")[0] + " " + data["isp"].split(" ")[1] : data["isp"];
                if (data_isp in data_sorted) {
                    data_sorted[data_isp] = data_sorted[data_isp].concat([data])
                } else {
                    data_sorted[data_isp] = [data]
                }
            }
            
            let datasets = []
            for (const isp of Object.keys(data_sorted)) {
                let ispdata_chart = {
                    label: isp,
                    data: []
                }
                for (const ispdata of data_sorted[isp]) {
                    let [t_h, t_m, t_s] = ispdata["created"].split(" ")[1].split(":");
                    ispdata_chart["data"] = ispdata_chart["data"].concat([{
                        x: t_h * 1.0 + t_m / 60 + t_s / 3600,
                        y: ispdata["dspeed"],
                        label: ispdata
                    }]);
                }
                datasets = datasets.concat([ispdata_chart])
            }
            
            datasets = datasets.sort((a, b) => a["data"].length < b["data"].length ? 1 : -1);
            
            // Modern glowing colors
            const modernColors = [
                { border: '#4ade80', bg: 'rgba(74, 222, 128, 0.2)' }, // Green
                { border: '#60a5fa', bg: 'rgba(96, 165, 250, 0.2)' }, // Blue
                { border: '#c084fc', bg: 'rgba(192, 132, 252, 0.2)' }, // Purple
                { border: '#f472b6', bg: 'rgba(244, 114, 182, 0.2)' }, // Pink
                { border: '#fbbf24', bg: 'rgba(251, 191, 36, 0.2)' }   // Yellow
            ];

            for (const [i, data] of datasets.entries()) {
                if (i < modernColors.length) {
                    datasets[i]["borderColor"] = modernColors[i].border;
                    datasets[i]["backgroundColor"] = modernColors[i].bg;
                    datasets[i]["pointBackgroundColor"] = modernColors[i].border;
                    datasets[i]["pointBorderColor"] = 'rgba(255,255,255,0.8)';
                    datasets[i]["pointBorderWidth"] = 1;
                    datasets[i]["pointRadius"] = 4;
                    datasets[i]["pointHoverRadius"] = 6;
                } else {
                    datasets[i]["borderColor"] = 'rgba(148, 163, 184, 0.5)';
                    datasets[i]["backgroundColor"] = 'rgba(148, 163, 184, 0.1)';
                    datasets[i]["pointBackgroundColor"] = 'rgba(148, 163, 184, 0.5)';
                    datasets[i]["pointRadius"] = 3;
                }
            }

            let scatterChartData = {
                datasets: datasets
            }

            Chart.defaults.global.defaultFontColor = '#94a3b8';
            Chart.defaults.global.defaultFontFamily = "'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif";

            var ctx = document.getElementById('canvas').getContext('2d');
            window.myScatter = Chart.Scatter(ctx, {
                data: scatterChartData,
                options: {
                    title: {
                        display: false
                    },
                    legend: {
                        labels: {
                            fontColor: '#cbd5e1',
                            usePointStyle: true,
                            padding: 20
                        }
                    },
                    tooltips: {
                        mode: 'nearest',
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleFontColor: '#f8fafc',
                        bodyFontColor: '#cbd5e1',
                        footerFontColor: '#94a3b8',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        cornerRadius: 8,
                        padding: 12,
                        callbacks: {
                            title: function(TooltipItem, data){  
                                return data["datasets"][TooltipItem[0]["datasetIndex"]]["label"]
                            },
                            label: function(TooltipItem, data){
                                return data["datasets"][TooltipItem["datasetIndex"]]["data"][TooltipItem["index"]]["label"]["isp"];
                            }, 
                            footer: function(TooltipItem, data){
                                let displaydata = data["datasets"][TooltipItem[0]["datasetIndex"]]["data"][TooltipItem[0]["index"]]["label"]; 
                                let showdict = { 
                                    "Location": displaydata["addr"],
                                    "Download": displaydata["dspeed"] + " Mbps",
                                    "Upload": displaydata["uspeed"] + " Mbps",
                                    "Ping": displaydata["ping"] + " ms",
                                    "Jitter": displaydata["jitter"] + " ms",
                                    "IP": displaydata["ip"],
                                    "Time": displaydata["created"]
                                };
                                let showtext = "";
                                for (const k of Object.keys(showdict)){
                                    showtext += k + ": " + showdict[k] + "\n";
                                }
                                return showtext;
                            }
                        },
                        footerFontStyle: 'normal'
                    },
                    scales: {
                        yAxes: [{
                            type: 'linear',
                            position: 'bottom',
                            gridLines: {
                                color: 'rgba(255, 255, 255, 0.05)',
                                zeroLineColor: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                fontColor: '#64748b',
                                userCallback: function(tick) {
                                    return tick.toString() + ' Mbps';
                                }
                            },
                            scaleLabel: {
                                labelString: 'Download Speed',
                                display: true,
                                fontColor: '#94a3b8'
                            }
                        }],
                        xAxes: [{
                            type: 'linear',
                            gridLines: {
                                color: 'rgba(255, 255, 255, 0.05)',
                                zeroLineColor: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                fontColor: '#64748b',
                                userCallback: function(tick) {
                                    return tick.toString() + ':00';
                                },
                                beginAtZero: true,
                                stepSize: 3,
                                max: 24
                            },
                            scaleLabel: {
                                labelString: 'Time of Day (Hours)',
                                display: true,
                                fontColor: '#94a3b8'
                            }
                        }]
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
            
            const isDark = document.documentElement.classList.contains("dark");
            updateChartTheme(isDark);
        }

        
        
        function updateChartTheme(isDark) {
            if (!window.myScatter) return;
            
            const textColor = isDark ? '#cbd5e1' : '#475569';
            const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
            const zeroLineColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            const tooltipBg = isDark ? 'rgba(15, 23, 42, 0.9)' : 'rgba(255, 255, 255, 0.9)';
            const tooltipTitle = isDark ? '#f8fafc' : '#0f172a';
            const tooltipBody = isDark ? '#cbd5e1' : '#334155';
            const tooltipFooter = isDark ? '#94a3b8' : '#64748b';
            const tooltipBorder = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
            
            Chart.defaults.global.defaultFontColor = isDark ? '#94a3b8' : '#64748b';
            
            window.myScatter.options.legend.labels.fontColor = textColor;
            
            window.myScatter.options.scales.xAxes[0].gridLines.color = gridColor;
            window.myScatter.options.scales.xAxes[0].gridLines.zeroLineColor = zeroLineColor;
            window.myScatter.options.scales.xAxes[0].ticks.fontColor = textColor;
            window.myScatter.options.scales.xAxes[0].scaleLabel.fontColor = isDark ? '#94a3b8' : '#64748b';
            
            window.myScatter.options.scales.yAxes[0].gridLines.color = gridColor;
            window.myScatter.options.scales.yAxes[0].gridLines.zeroLineColor = zeroLineColor;
            window.myScatter.options.scales.yAxes[0].ticks.fontColor = textColor;
            window.myScatter.options.scales.yAxes[0].scaleLabel.fontColor = isDark ? '#94a3b8' : '#64748b';
            
            window.myScatter.options.tooltips.backgroundColor = tooltipBg;
            window.myScatter.options.tooltips.titleFontColor = tooltipTitle;
            window.myScatter.options.tooltips.bodyFontColor = tooltipBody;
            window.myScatter.options.tooltips.footerFontColor = tooltipFooter;
            window.myScatter.options.tooltips.borderColor = tooltipBorder;
            
            // Update dataset colors
            const darkColors = [
                { border: '#4ade80', bg: 'rgba(74, 222, 128, 0.2)' }, // Green
                { border: '#60a5fa', bg: 'rgba(96, 165, 250, 0.2)' }, // Blue
                { border: '#c084fc', bg: 'rgba(192, 132, 252, 0.2)' }, // Purple
                { border: '#f472b6', bg: 'rgba(244, 114, 182, 0.2)' }, // Pink
                { border: '#fbbf24', bg: 'rgba(251, 191, 36, 0.2)' }   // Yellow
            ];
            
            const lightColors = [
                { border: '#16a34a', bg: 'rgba(22, 163, 74, 0.2)' }, // Darker Green
                { border: '#2563eb', bg: 'rgba(37, 99, 235, 0.2)' }, // Darker Blue
                { border: '#9333ea', bg: 'rgba(147, 51, 234, 0.2)' }, // Darker Purple
                { border: '#db2777', bg: 'rgba(219, 39, 119, 0.2)' }, // Darker Pink
                { border: '#d97706', bg: 'rgba(217, 119, 6, 0.2)' }   // Darker Yellow
            ];
            
            const colors = isDark ? darkColors : lightColors;
            
            window.myScatter.data.datasets.forEach((dataset, i) => {
                if (i < colors.length) {
                    dataset.borderColor = colors[i].border;
                    dataset.backgroundColor = colors[i].bg;
                    dataset.pointBackgroundColor = colors[i].border;
                    dataset.pointBorderColor = isDark ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,1)';
                } else {
                    dataset.borderColor = isDark ? 'rgba(148, 163, 184, 0.5)' : 'rgba(100, 116, 139, 0.5)';
                    dataset.backgroundColor = isDark ? 'rgba(148, 163, 184, 0.1)' : 'rgba(100, 116, 139, 0.1)';
                    dataset.pointBackgroundColor = isDark ? 'rgba(148, 163, 184, 0.5)' : 'rgba(100, 116, 139, 0.5)';
                }
            });
            
            window.myScatter.update();
        }


        window.onload = function() {
            mainfunc();
        };

        // Mouse spotlight effect — update CSS variables on hover
        document.addEventListener("mousemove", function (e) {
            var el = e.target.closest(".glass-panel");
            if (!el) return;
            var rect = el.getBoundingClientRect();
            var x = (e.clientX - rect.left) / rect.width * 100;
            var y = (e.clientY - rect.top) / rect.height * 100;
            el.style.setProperty("--mouse-x", x + "%");
            el.style.setProperty("--mouse-y", y + "%");
        });
    </script>
</body>
</html>
