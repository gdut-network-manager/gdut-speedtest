    <script>
        // Theme initialization to prevent FOUC
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'auto';
            if (savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        myriad: ['MyriadPro', 'sans-serif'],
                        futura: ['Futura LT', 'sans-serif'],
                    },
                    colors: {
                        glass: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',

    <style>
        @font-face {
            font-family: 'MyriadPro';
            src: url('./font/MyriadPro-Regular.otf') format('opentype');
            font-weight: normal;
        }
        @font-face {
            font-family: 'MyriadPro';
            src: url('./font/MyriadPro-Bold.otf') format('opentype');
            font-weight: bold;
        }
        @font-face {
            font-family: 'Futura LT';
            src: url('./font/Futura LT Book.ttf') format('truetype');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Futura LT';
            src: url('./font/Futura LT Bold.ttf') format('truetype');
            font-weight: bold;
        }
        
        /* Grid background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
        .dark .bg-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        
        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.06);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .dark .glass-panel {
            background: rgba(20, 21, 38, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Card hover lift effect */
        .glass-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 64px -12px rgba(15, 23, 42, 0.12);
        }
        .dark .glass-panel:hover {
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6);
        }

        /* Mouse spotlight effect */
        .glass-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.12), transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 0;
        }
        .dark .glass-panel::after {
            background: radial-gradient(circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                                        rgba(255, 255, 255, 0.08), transparent 70%);
        }
        .glass-panel:hover::after {
            opacity: 1;
        }
        /* Ensure content stays above spotlight layer */
        .glass-panel > * {
            position: relative;
            z-index: 1;
        }
        /* Allow hover popups to escape parent stacking context */
        .glass-panel > .group.relative {
            z-index: 50;
        }
        
        /* Glowing CTA */
        .cta-glow {
            box-shadow: 0 0 20px rgba(4, 183, 254, 0.2), inset 0 0 20px rgba(4, 183, 254, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .cta-glow {
            box-shadow: 0 0 20px rgba(4, 183, 254, 0.4), inset 0 0 20px rgba(4, 183, 254, 0.1);
        }
        .cta-glow:hover {
            box-shadow: 0 0 30px rgba(4, 183, 254, 0.4), inset 0 0 30px rgba(4, 183, 254, 0.15);
            transform: scale(1.05);
        }
        .dark .cta-glow:hover {
            box-shadow: 0 0 30px rgba(4, 183, 254, 0.7), inset 0 0 30px rgba(4, 183, 254, 0.3);
        }
        .cta-running {
            box-shadow: 0 0 20px rgba(255, 113, 230, 0.2), inset 0 0 20px rgba(255, 113, 230, 0.05);
            border-color: rgba(255, 113, 230, 0.3);
        }
        .dark .cta-running {
            box-shadow: 0 0 20px rgba(255, 113, 230, 0.4), inset 0 0 20px rgba(255, 113, 230, 0.1);
            border-color: rgba(255, 113, 230, 0.5);
        }
        .cta-running:hover {
            box-shadow: 0 0 30px rgba(255, 113, 230, 0.4), inset 0 0 30px rgba(255, 113, 230, 0.15);
            transform: scale(1.05);
        }
        .dark .cta-running:hover {
            box-shadow: 0 0 30px rgba(255, 113, 230, 0.7), inset 0 0 30px rgba(255, 113, 230, 0.3);
        }
        
        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Hide scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>

</head>

    <script type="text/javascript">
        // Theme Switcher Logic
        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme();
        }

        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'auto';
            const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            
            // Update slider position
            const slider = document.getElementById('theme-slider');
            const btnLight = document.getElementById('btn-theme-light');
            const btnDark = document.getElementById('btn-theme-dark');
            const btnAuto = document.getElementById('btn-theme-auto');
            
            if (slider && btnLight && btnDark && btnAuto) {
                btnLight.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnDark.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                btnAuto.classList.remove('text-cyan-600', 'dark:text-cyan-400');
                
                if (theme === 'light') {
                    slider.style.transform = 'translateX(0)';
                    btnLight.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else if (theme === 'dark') {
                    slider.style.transform = 'translateX(4rem)'; // 16 * 0.25rem = 4rem
                    btnDark.classList.add('text-cyan-600', 'dark:text-cyan-400');
                } else {
                    slider.style.transform = 'translateX(8rem)';
                    btnAuto.classList.add('text-cyan-600', 'dark:text-cyan-400');
                }
            }
        }

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'auto') {
                applyTheme();
            }
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', applyTheme);

        // INITIALIZE SPEEDTEST
        var s = new Speedtest(); // create speedtest object
        
        var xhr = new XMLHttpRequest();
        var url_report = './backend/report.php';
        var milestone = 0;
        var key_prefix = Date.parse(new Date());
        
        // Colors for gauges
        var dlColorBegin = "#04b7fe", dlColorEnd = "#70ffb1";
        var ulColorBegin = "#7a55d4", ulColorEnd = "#ff71e6";
        
        // Easing function for smooth gauge animation
        var currentDlAmount = 0;
        var currentUlAmount = 0;
        
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }
        
        // CODE FOR GAUGES
        function drawMeter(c, targetAmount, bk, colorBegin, colorEnd, isDl, progress) {
            var ctx = c.getContext("2d");
            var dp = window.devicePixelRatio || 1;
            var cw = c.clientWidth * dp;
            var ch = c.clientHeight * dp;
            
            // Check theme dynamically
            var isDark = document.documentElement.classList.contains('dark');
            var currentBk = isDark ? "rgba(255, 255, 255, 0.05)" : "rgba(0, 0, 0, 0.05)";
            var innerCoreColor = isDark ? "rgba(255,255,255,0.5)" : "rgba(0,0,0,0.2)";
            var progBkColor = isDark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)";
            
            if (c.width !== cw || c.height !== ch) {
                c.width = cw;
                c.height = ch;
            }
        
            // Smooth interpolation
            if (isDl) {
                currentDlAmount = lerp(currentDlAmount, targetAmount, 0.1);
                var amount = currentDlAmount;
            } else {
                currentUlAmount = lerp(currentUlAmount, targetAmount, 0.1);
                var amount = currentUlAmount;
            }
        
            ctx.clearRect(0, 0, cw, ch);
        
            var centerX = cw / 2;
            var centerY = ch / 2 + (ch * 0.1); // Offset slightly down
            var radius = Math.min(cw, ch) / 2.2;
            var lineWidth = radius * 0.15;
            
            var startAngle = Math.PI * 0.8;
            var endAngle = Math.PI * 2.2;
            var totalAngle = endAngle - startAngle;
        
            // Draw Background Track
            ctx.beginPath();
            ctx.strokeStyle = currentBk;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = "round";
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.stroke();
        
            if (amount > 0) {
                // Create Gradient
                var g = ctx.createLinearGradient(0, centerY - radius, cw, centerY + radius);
                g.addColorStop(0, colorBegin);
                g.addColorStop(1, colorEnd);
        
                var currentEndAngle = startAngle + (totalAngle * amount);
        
                // Draw Glow
                ctx.beginPath();
                ctx.strokeStyle = g;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = "round";
                ctx.shadowBlur = (isDark ? 20 : 10) * dp;
                ctx.shadowColor = colorBegin;
                ctx.arc(centerX, centerY, radius, startAngle, currentEndAngle);
                ctx.stroke();
                
                // Reset shadow for next draws
                ctx.shadowBlur = 0;
                
                // Draw inner bright core
                ctx.beginPath();
                ctx.strokeStyle = innerCoreColor;
                ctx.lineWidth = lineWidth * 0.3;
                ctx.lineCap = "round";
                ctx.arc(centerX, centerY, radius, startAngle, currentEndAngle);
                ctx.stroke();
            }

            // Draw progress bar at the bottom
            if (typeof progress !== "undefined" && progress > 0) {
                var progY = ch * 0.95;
                var progStartX = cw * 0.3;
                var progWidth = cw * 0.4;
                
                ctx.beginPath();
                ctx.strokeStyle = progBkColor;
                ctx.lineWidth = lineWidth * 0.4;
                ctx.lineCap = "round";
                ctx.moveTo(progStartX, progY);
                ctx.lineTo(progStartX + progWidth, progY);
                ctx.stroke();
        
                ctx.beginPath();
                ctx.strokeStyle = colorBegin;
                ctx.lineWidth = lineWidth * 0.4;
                ctx.lineCap = "round";
                ctx.moveTo(progStartX, progY);
                ctx.lineTo(progStartX + (progWidth * progress), progY);
                ctx.stroke();
            }
        }
        
        function mbpsToAmount(s){
            return 1-(1/(Math.pow(1.3,Math.sqrt(s))));
        }
        
        function format(d){
            d=Number(d);
            if(d<10) return d.toFixed(2);
            if(d<100) return d.toFixed(1);
            return d.toFixed(0);
        }
        
        // UI CODE
        var uiData = null;
        function startStop(){
            var btn = document.getElementById("startStopBtn");
            var text = document.getElementById("startStopText");
            
            if(s.getState() == 3){
                // speedtest is running, abort
                s.abort();
                uiData = null;
                btn.classList.remove("cta-running");
                btn.classList.add("border-cyan-500/30", "dark:border-cyan-500/50");
                btn.classList.remove("border-purple-500/30", "dark:border-purple-500/50");
                text.textContent = "开始测速";
                text.classList.remove("text-purple-600", "dark:text-purple-50");
                text.classList.add("text-cyan-600", "dark:text-cyan-50");
                initUI();
            } else {
                // test is not running, begin
                btn.classList.add("cta-running");
                btn.classList.remove("border-cyan-500/30", "dark:border-cyan-500/50");
                btn.classList.add("border-purple-500/30", "dark:border-purple-500/50");
                text.textContent = "终止测速";
                text.classList.remove("text-cyan-600", "dark:text-cyan-50");
                text.classList.add("text-purple-600", "dark:text-purple-50");
                
                s.onupdate = function(data){
                    uiData = data;
                };
                s.onend = function(aborted){
                    btn.classList.remove("cta-running");
                    btn.classList.add("border-cyan-500/30", "dark:border-cyan-500/50");
                    btn.classList.remove("border-purple-500/30", "dark:border-purple-500/50");
                    text.textContent = "开始测速";
                    text.classList.remove("text-purple-600", "dark:text-purple-50");
                    text.classList.add("text-cyan-600", "dark:text-cyan-50");
                    updateUI(true);
                };
                s.start();
            }
        }
        
        function updateUI(forced){
            if(!forced && s.getState() != 3) return;
            if(uiData == null) return;
            
            var status = uiData.testState;
            
            document.getElementById("ip").textContent = uiData.clientIp;
            
            var dlVal = (status == 1 && uiData.dlStatus == 0) ? "..." : format(uiData.dlStatus);
            document.getElementById("dlText").textContent = dlVal;
            
            var ulVal = (status == 3 && uiData.ulStatus == 0) ? "..." : format(uiData.ulStatus);
            document.getElementById("ulText").textContent = ulVal;
            
            document.getElementById("pingText").textContent = format(uiData.pingStatus);
            document.getElementById("jitText").textContent = format(uiData.jitterStatus);
            
            var prog = (Number(uiData.dlProgress)*2 + Number(uiData.ulProgress)*2 + Number(uiData.pingProgress))/5;
            
            var ipIspArr = document.getElementById("ip").textContent.split(' - ', 3);
            var ip = ipIspArr[0];
            var isp = ipIspArr[1];
            var addr = ipIspArr[2] === undefined ? '' : ipIspArr[2];
            var progress = Math.floor(100 * prog);
            var key = key_prefix + "_" + ip;
            
            if (progress > 20 && (progress % 10 == 0) && progress != milestone) {
                var params = 'key='+key+'&ip='+ip+'&isp='+isp+'&addr='+addr+'&dspeed='+document.getElementById("dlText").textContent+'&uspeed='+document.getElementById("ulText").textContent+'&ping='+document.getElementById("pingText").textContent+'&jitter='+document.getElementById("jitText").textContent;
                xhr.timeout = 3000;
                xhr.ontimeout = function (e) {
                    console.log('上报超时');
                };
                xhr.open('POST', url_report, true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.send(params);
                milestone = progress;
            }
        }
        
        function oscillate(){
            return 1 + 0.02 * Math.sin(Date.now() / 100);
        }
        
        // Animation loop for smooth gauges
        window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.msRequestAnimationFrame || (function(callback,element){setTimeout(callback,1000/60);});
        
        function frame(){
            requestAnimationFrame(frame);
            
            // Always draw meters to allow smooth easing even when not updating data
            var status = uiData ? uiData.testState : 0;
            var dlTarget = (uiData && status >= 1) ? mbpsToAmount(Number(uiData.dlStatus*(status==1?oscillate():1))) : 0;
            var ulTarget = (uiData && status >= 3) ? mbpsToAmount(Number(uiData.ulStatus*(status==3?oscillate():1))) : 0;
            
            var dlProg = uiData ? Number(uiData.dlProgress) : 0;
            var ulProg = uiData ? Number(uiData.ulProgress) : 0;
        
            drawMeter(document.getElementById("dlMeter"), dlTarget, null, dlColorBegin, dlColorEnd, true, dlProg);
            drawMeter(document.getElementById("ulMeter"), ulTarget, null, ulColorBegin, ulColorEnd, false, ulProg);
            
            updateUI();
        }
        frame(); // start frame loop
        
        function initUI(){
            currentDlAmount = 0;
            currentUlAmount = 0;
            document.getElementById("dlText").textContent = "0.00";
            document.getElementById("ulText").textContent = "0.00";
            document.getElementById("pingText").textContent = "0";
            document.getElementById("jitText").textContent = "0";
            document.getElementById("ip").textContent = "";
        }
        
        setTimeout(function(){
            initUI();
            startStop();
        }, 1200);

        // Mouse spotlight effect — update CSS variables on hover
        document.addEventListener("mousemove", function (e) {
            var el = e.target.closest(".glass-panel");
            if (!el) return;
            var rect = el.getBoundingClientRect();
            var x = (e.clientX - rect.left) / rect.width * 100;
            var y = (e.clientY - rect.top) / rect.height * 100;
            el.style.setProperty("--mouse-x", x + "%");
            el.style.setProperty("--mouse-y", y + "%");
        });

        // Copyright year
        document.getElementById("copyright").textContent = "© " + new Date().getFullYear() + " 广东工业大学学生网管队";
    </script>
</body>
</html>
