image: ubuntu:22.04

stages:
  - check-phase
  - build-phase-1
  - build-phase-2

variables:
  BIG_VERSION: v1.0

sonarqube-check:
  stage: check-phase
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  tags:
    - dev
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script: 
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

github-mirror:
  stage: check-phase
  image: alpine:latest
  tags:
    - dev
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "$GITHUB_REPO" ] || [ -z "$GITHUB_TOKEN" ]; then
        echo "GITHUB_REPO or GITHUB_TOKEN is not set, skipping..."
        exit 0
      fi
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_REPO#https://}"
    - git push github HEAD:${CI_COMMIT_REF_NAME} --force
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

docker-build-and-push:
  image: registry.gdut.edu.cn/docker/library/docker:24-cli
  stage: build-phase-1
  tags:
    - Docker
  services:
    - name: registry.gdut.edu.cn/docker/library/docker:24-cli
  before_script:
    - echo "======================== SETUP BUILDX ENVIRONMENT =========================="
    - docker info
    - apk add --no-cache git
    # 创建并使用 buildx builder
    - docker buildx create --use --name multiarch-builder --driver docker-container --platform linux/amd64,linux/arm64,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x,linux/mips64le --bootstrap || docker buildx use multiarch-builder
    - docker buildx inspect --bootstrap
  script:
    - echo "========================== GENERATE VERSION TAGS ==========================="
    - export COMMIT_TIME=$(echo $CI_JOB_STARTED_AT | sed -E 's/^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})\+.*$/\1\2\3\4\5\6/g')
    - echo "The commit timestamp is $(echo $COMMIT_TIME | sed 's/[-T:.]//g')"
    - echo "============================= SET BUILD METADATA ==========================="
    - export IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - export IMAGE_REVISION=${CI_COMMIT_SHA}
    - echo "IMAGE_CREATED=$IMAGE_CREATED"
    - echo "IMAGE_VERSION=${BIG_VERSION}-$(echo $COMMIT_TIME)"
    - echo "IMAGE_REVISION=$IMAGE_REVISION"
    - echo "============================= LOGIN TO HARBOR =============================="
    - docker login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "======================= BUILD AND PUSH DOCKER IMAGES ======================="
    - |
      docker buildx build \
        --platform linux/386,linux/amd64,linux/arm64,linux/arm/v7 \
        --build-arg IMAGE_CREATED=${IMAGE_CREATED} \
        --build-arg IMAGE_VERSION=${BIG_VERSION}-$(echo $COMMIT_TIME) \
        --build-arg IMAGE_REVISION=${IMAGE_REVISION} \
        --tag ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${BIG_VERSION}-${COMMIT_TIME} \
        --tag ${HARBORHOST}/gdutnic-speedtest/speedtest-x:latest \
        --push \
        .
    - echo "=================== ADD ANNOTATIONS TO MANIFEST LIST ======================"
    - |
      for tag in ${BIG_VERSION}-$(echo $COMMIT_TIME) latest; do
        echo "Adding annotations to ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${tag}"
        docker buildx imagetools create --tag ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${tag} \
          --annotation "index:org.opencontainers.image.created=${IMAGE_CREATED}" \
          --annotation "index:org.opencontainers.image.authors=gregPerlinLi" \
          --annotation "index:org.opencontainers.image.url=https://git.gdutnic.com/gregPerlinLi/gdutnic-speedtest-x" \
          --annotation "index:org.opencontainers.image.documentation=https://git.gdutnic.com/gregPerlinLi/gdutnic-speedtest-x/-/blob/master/README.md" \
          --annotation "index:org.opencontainers.image.source=https://git.gdutnic.com/gregPerlinLi/gdutnic-speedtest-x" \
          --annotation "index:org.opencontainers.image.version=${BIG_VERSION}-$(echo $COMMIT_TIME)" \
          --annotation "index:org.opencontainers.image.revision=${IMAGE_REVISION}" \
          --annotation "index:org.opencontainers.image.vendor=gregPerlinLi" \
          --annotation "index:org.opencontainers.image.licenses=MIT" \
          --annotation "index:org.opencontainers.image.title=广东工业大学测速网站" \
          --annotation "index:org.opencontainers.image.description=本仓库为网管队测速网站项目，为 LibreSpeed 的延伸项目，LibreSpeed 是一个非常轻巧的网站测速工具。" \
          ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${tag}
      done
    #- echo "============================= CLEAN UP MIRRORS ============================="
    # - docker rmi ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${BIG_VERSION}-$(echo $COMMIT_TIME)
    - echo "============================ EXPORT IMAGE TAGS ============================="
    - echo "COMMIT_TIME=$COMMIT_TIME" >> build.env
  after_script:
    - echo "============================ CLEAN BUILD CACHE ============================="
    - docker buildx prune -a -f
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 30 min
  only:
    - master

