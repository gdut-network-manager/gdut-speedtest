podman-build-and-push:
  image: quay.io/podman/stable:latest
  stage: build-phase-1
  tags:
    - dev
  before_script:
    - echo "======================== SETUP PODMAN ENVIRONMENT =========================="
    # 配置 Podman 使用 fuse-overlayfs 和 vfs 存储驱动
    - mkdir -p /etc/containers
    - |
      cat > /etc/containers/storage.conf <<EOF
      [storage]
      driver = "vfs"
      runroot = "/tmp/containers/storage"
      graphroot = "/tmp/containers/storage"
      [storage.options]
      mount_program = "/usr/bin/fuse-overlayfs"
      EOF
    # 配置 subuid 和 subgid
    - echo "podman:100000:65536" > /etc/subuid
    - echo "podman:100000:65536" > /etc/subgid
    # 安装必要的工具
    - dnf install -y git qemu-user-static fuse-overlayfs
    - podman info
    - podman version
  script:
    - echo "========================== GENERATE VERSION TAGS ==========================="
    - export COMMIT_TIME=$(echo $CI_JOB_STARTED_AT | sed -E 's/^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})\+.*$/\1\2\3\4\5\6/g')
    - echo "The commit timestamp is $(echo $COMMIT_TIME | sed 's/[-T:.]//g')"
    - echo "============================= SET BUILD METADATA ==========================="
    - export IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - export IMAGE_REVISION=${CI_COMMIT_SHA}
    - echo "IMAGE_CREATED=$IMAGE_CREATED"
    - echo "IMAGE_VERSION=${BIG_VERSION}-$(echo $COMMIT_TIME)"
    - echo "IMAGE_REVISION=$IMAGE_REVISION"
    - echo "============================= LOGIN TO HARBOR =============================="
    - podman login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "======================= BUILD AND PUSH MULTI-ARCH IMAGES ==================="
    # 创建 manifest
    - export MANIFEST_NAME=${HARBORHOST}/gdutnic-speedtest/speedtest-x:${BIG_VERSION}-${COMMIT_TIME}
    - export MANIFEST_LATEST=${HARBORHOST}/gdutnic-speedtest/speedtest-x:latest
    # 为每个架构构建镜像
    - |
      PLATFORMS="linux/386 linux/amd64 linux/arm64 linux/arm/v7"
      
      # 创建 manifest
      podman manifest create ${MANIFEST_NAME}
      
      for PLATFORM in ${PLATFORMS}; do
        echo "Building for platform: ${PLATFORM}"
        ARCH=$(echo ${PLATFORM} | cut -d'/' -f2)
        VARIANT=$(echo ${PLATFORM} | cut -d'/' -f3)
        
        # 构建特定架构的镜像
        if [ -z "${VARIANT}" ]; then
          TAG_SUFFIX="${ARCH}"
          PLATFORM_FLAG="--platform ${PLATFORM}"
        else
          TAG_SUFFIX="${ARCH}-${VARIANT}"
          PLATFORM_FLAG="--platform ${PLATFORM}"
        fi
        
        podman build \
          ${PLATFORM_FLAG} \
          --build-arg IMAGE_CREATED=${IMAGE_CREATED} \
          --build-arg IMAGE_VERSION=${BIG_VERSION}-$(echo $COMMIT_TIME) \
          --build-arg IMAGE_REVISION=${IMAGE_REVISION} \
          --tag ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${BIG_VERSION}-${COMMIT_TIME}-${TAG_SUFFIX} \
          --format docker \
          .
        
        # 添加到 manifest
        podman manifest add ${MANIFEST_NAME} \
          ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${BIG_VERSION}-${COMMIT_TIME}-${TAG_SUFFIX}
      done
    - echo "========================== ANNOTATE MANIFEST IMAGES ========================"
    - |
      # 为 manifest 添加注解
      podman manifest annotate ${MANIFEST_NAME} \
        --annotation "org.opencontainers.image.created=${IMAGE_CREATED}" \
        --annotation "org.opencontainers.image.authors=gregPerlinLi" \
        --annotation "org.opencontainers.image.url=https://git.gdutnic.com/gregPerlinLi/gdutnic-speedtest-x" \
        --annotation "org.opencontainers.image.documentation=https://git.gdutnic.com/gregPerlinLi/gdutnic-speedtest-x/-/blob/master/README.md" \
        --annotation "org.opencontainers.image.source=https://git.gdutnic.com/gregPerlinLi/gdutnic-speedtest-x" \
        --annotation "org.opencontainers.image.version=${BIG_VERSION}-$(echo $COMMIT_TIME)" \
        --annotation "org.opencontainers.image.revision=${IMAGE_REVISION}" \
        --annotation "org.opencontainers.image.vendor=gregPerlinLi" \
        --annotation "org.opencontainers.image.licenses=MIT" \
        --annotation "org.opencontainers.image.title=GDUTNIC SpeedTest X" \
        --annotation "org.opencontainers.image.description=本仓库为网管队测速网站项目，为 LibreSpeed 的延伸项目，LibreSpeed 是一个非常轻巧的网站测速工具。" \
        || echo "Annotation may not be fully supported, continuing..."
    - echo "========================== PUSH MANIFEST TO HARBOR ========================="
    # 推送带版本号的 manifest
    - podman manifest push ${MANIFEST_NAME} docker://${MANIFEST_NAME} --all
    # 创建并推送 latest tag
    - podman tag ${MANIFEST_NAME} ${MANIFEST_LATEST}
    - podman manifest push ${MANIFEST_LATEST} docker://${MANIFEST_LATEST} --all
    - echo "============================ EXPORT IMAGE TAGS ============================="
    - echo "COMMIT_TIME=$COMMIT_TIME" >> build.env
  after_script:
    - echo "============================ CLEAN BUILD CACHE ============================="
    - podman system prune -a -f || true
    - podman manifest rm ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${BIG_VERSION}-${COMMIT_TIME} || true
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 30 min
  only:
    - master

image-sign:
  image: ubuntu:22.04
  stage: build-phase-2
  tags:
    - dev
  before_script:
    - echo "============================ CHANGE APT MIRROR ============================="
    - echo 'deb http://mirrors.gdut.edu.cn/ubuntu/ jammy main restricted universe multiverse
            deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy main restricted universe multiverse
            deb http://mirrors.gdut.edu.cn/ubuntu/ jammy-updates main restricted universe multiverse
            deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy-updates main restricted universe multiverse
            deb http://mirrors.gdut.edu.cn/ubuntu/ jammy-backports main restricted universe multiverse
            deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy-backports main restricted universe multiverse
            deb http://mirrors.gdut.edu.cn/ubuntu/ jammy-security main restricted universe multiverse
            deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy-security main restricted universe multiverse' > /etc/apt/sources.list
    - apt update -y
    - echo "======================== INSTALL REQUIRED TOOLS ============================"
    - apt install curl jq skopeo -y
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "COMMIT_TIME=${COMMIT_TIME}"
    - echo "============================== INSTALL COSIGN =============================="
    # - wget --no-check-certificate "https://az1.minio.gdutnic.com/gdutnic/public/cosign_1.6.0_amd64.deb"
    - curl -fL -o cosign_1.6.0_amd64.deb --insecure "https://cn-gz-1.minio.gdutnic.com/gdutnic/public/cosign_1.6.0_amd64.deb"
    - dpkg -i cosign_1.6.0_amd64.deb
    - mv /usr/local/bin/cosign-linux-amd64 /usr/local/bin/cosign
    - echo "=============================== KEY GENERATE ==============================="
    - export COSIGN_PASSWORD=$PASSWORD
    - cosign generate-key-pair
    - echo "============================= LOGIN TO HARBOR =============================="
    - cosign login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "==================== EXTRACT ARCHITECTURE DIGESTS ========================="
    # 使用 skopeo 获取镜像 manifest 信息
    - |
      echo "Fetching manifest for ${HARBORHOST}/gdutnic-speedtest/speedtest-x:latest"
      skopeo inspect --raw docker://${HARBORHOST}/gdutnic-speedtest/speedtest-x:latest > manifest.json
      
      # 解析 manifest，提取每个架构的 digest
      cat manifest.json | jq -r '
        if .manifests then
          .manifests[] | "\(.platform.architecture):\(.digest)"
        else
          "single-arch:\(.config.digest // "unknown")"
        end
      ' > arch_digests.txt
      
      echo "Architecture digests:"
      cat arch_digests.txt
    - echo "===================== SIGN EACH ARCHITECTURE IMAGE ========================"
    # 签名 manifest list (整体镜像)
    - echo "Signing manifest list for latest tag..."
    - cosign sign --key cosign.key ${HARBORHOST}/gdutnic-speedtest/speedtest-x:latest
    # 签名每个架构的镜像
    - |
      echo "Signing individual architecture images..."
      while IFS=: read -r arch digest; do
        if [ "$arch" != "single-arch" ] && [ -n "$digest" ]; then
          echo "Signing $arch architecture with digest: $digest"
          cosign sign --key cosign.key ${HARBORHOST}/gdutnic-speedtest/speedtest-x@${digest}
        else
          echo "Skipping single-arch or empty digest"
        fi
      done < arch_digests.txt
    - echo "==================== SIGN VERSIONED TAG ARCHITECTURES ====================="
    # 如果需要也对带版本号的标签进行签名
    - cosign sign --key cosign.key ${HARBORHOST}/gdutnic-speedtest/speedtest-x:${IMAGE_TAG}
    # - echo "=============================== IMAGE SIGN ================================="
    # - cosign sign --key cosign.key ${HARBORHOST}/gdutnic-speedtest/speedtest-x:latest
    - echo "========================== FIX FILE PERMISSIONS ============================"
    # 修改文件权限，使 Runner 可以读取
    - chmod 644 cosign.key cosign.pub
    - ls -la cosign.*
    - echo "================================ EXPORT KEY ================================"
    - echo "The Password of the key is Harbor account's password, the key will reserved for 30 minutes."
    - echo "COMMIT_TIME=${COMMIT_TIME}" >> build.env
  artifacts:
    paths:
      - cosign.key
      - cosign.pub
    reports:
      dotenv: build.env
    expire_in: 30 min
  only:
    - master

